[project]
name = "shop"
version = "0.1.0"
description = "Personal shopping search & lowest-price tracker (Naver / Emart)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "playwright>=1.48.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.scripts]
shop = "shop.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shop"]

[tool.hatch.build.targets.wheel.sources]
"src/shop" = "shop"

[dependency-groups]
dev = ["pytest>=8.0.0"]
